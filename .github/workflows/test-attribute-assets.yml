name: test-attribute-assets

on:
  push:
    branches: [main]
    paths:
      - assets/**/*.mdatr
      - tests/test_attribute_collision_assets.py
      - .github/workflows/test-attribute-assets.yml
  pull_request:
    branches: [main]
    paths:
      - assets/**/*.mdatr
      - tests/test_attribute_collision_assets.py
      - .github/workflows/test-attribute-assets.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Attribute collision contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Validate AttributeData assets
        run: >-
          python -m unittest discover -s tests
          -p test_attribute_collision_assets.py -v
