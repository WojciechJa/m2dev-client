name: test-pack-tool

on:
  push:
    branches: [main]
    paths:
      - assets/pack.py
      - tests/test_pack.py
      - .github/workflows/test-pack-tool.yml
  pull_request:
    branches: [main]
    paths:
      - assets/pack.py
      - tests/test_pack.py
      - .github/workflows/test-pack-tool.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Pack tool unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Run tests
        run: python -m unittest discover -s tests -v
